version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate template files
          command: |
            bash -n src/start_script.sh
            python3 -m py_compile tools/*.py
            find . -path ./.git -prune -o -name '*.json' -print0 | xargs -0 -r -n1 python3 -m json.tool >/dev/null
            python3 tools/validate_models.py --registry src/models_registry.json --workflows workflows --template template.json --offline
            PYTHONPATH=tools python3 -m unittest tools/test_update_runpod_template.py
      - run:
          name: Validate inherited base-image contract
          command: |
            grep -Eq '^ARG BASE_IMAGE=.*comfyui-base:cuda[0-9.]+-torch[0-9.]+-comfyui[0-9.]+-python[0-9.]+-r[1-9][0-9]*$' Dockerfile
            ! grep -q 'hearmeman/comfyui-base' Dockerfile
            ! grep -q 'apt-get install.*tmux' Dockerfile
            ! grep -q '/ComfyUI/custom_nodes/' Dockerfile
            grep -q '^RUNTIME_DIR=/opt/comfyui-runtime$' src/start_script.sh
            ! grep -q 'Hearmeman24/comfyui-runtime.git' src/start_script.sh

  publish:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      DOCKER_BUILDKIT: "1"
      RELEASE_REF: << pipeline.config.ref >>
    steps:
      - checkout
      - run:
          name: Validate release configuration
          command: |
            export RELEASE_TAG="${RELEASE_REF#refs/tags/}"
            [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_TAG" =~ ^v[1-9][0-9]*$ ]] || { echo 'Release tag must be vN, for example v1'; exit 2; }
            export DOCKER_IMAGE="${DOCKER_IMAGE:-coohh88/comfyui-wan}"
            export TEMPLATE_REPOSITORY_URL="${TEMPLATE_REPOSITORY_URL:-https://github.com/ilklatte/comfyui-wan.git}"
            for name in DOCKER_IMAGE TEMPLATE_REPOSITORY_URL DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
              test -n "${!name:-}" || { echo "$name is required"; exit 2; }
            done
            base_image=$(python3 -c "import json; print(json.load(open('pins.json'))['base_image'])")
            test -n "$base_image" || { echo 'pins.json base_image is required'; exit 2; }
            [[ "$base_image" != replace-with-* ]] || { echo 'Replace the Wan base_image with your published, version-qualified comfyui-base image'; exit 2; }
            [[ "$base_image" =~ /comfyui-base:cuda[0-9.]+-torch[0-9.]+-comfyui[0-9.]+-python[0-9.]+-r[1-9][0-9]*$ ]] || { echo 'Wan base_image must use an immutable rN comfyui-base tag'; exit 2; }
            {
              echo "export DOCKER_IMAGE='$DOCKER_IMAGE'"
              echo "export TEMPLATE_REPOSITORY_URL='$TEMPLATE_REPOSITORY_URL'"
              echo "export BASE_IMAGE='$base_image'"
              echo "export IMAGE_TAG='$RELEASE_TAG'"
            } >> "$BASH_ENV"
      - run:
          name: Log in to Docker Hub
          command: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Show available build storage
          command: |
            df -h /
            docker system df
      - run:
          name: Build immutable image
          no_output_timeout: 30m
          command: |
            docker build \
              --progress=plain \
              --build-arg "BASE_IMAGE=$BASE_IMAGE" \
              --build-arg "TEMPLATE_REPOSITORY_URL=$TEMPLATE_REPOSITORY_URL" \
              --tag "$DOCKER_IMAGE:$IMAGE_TAG" \
              --tag "$DOCKER_IMAGE:latest" \
              .
      - run:
          name: Show final image storage
          command: |
            docker image ls "$DOCKER_IMAGE"
            docker system df
            df -h /
      - run:
          name: Push image tags
          no_output_timeout: 30m
          command: |
            docker push "$DOCKER_IMAGE:$IMAGE_TAG"
            docker push "$DOCKER_IMAGE:latest"
      - run:
          name: Promote image to RunPod templates
          command: |
            if [ -z "${RUNPOD_TEMPLATE_IDS:-}" ]; then
              echo 'RUNPOD_TEMPLATE_IDS is not configured; skipping promotion.'
              exit 0
            fi
            test -n "${RUNPOD_API_KEY:-}" || { echo 'RUNPOD_API_KEY is required when RUNPOD_TEMPLATE_IDS is configured'; exit 2; }
            python3 tools/update_runpod_template.py \
              --image "$DOCKER_IMAGE:$IMAGE_TAG" \
              --expected-repository "$DOCKER_IMAGE" \
              --template-ids "$RUNPOD_TEMPLATE_IDS"

workflows:
  verify-and-publish:
    jobs:
      - verify:
          filters: pipeline.event.name == "push"
      - publish:
          requires:
            - verify
          filters: pipeline.config.ref matches "^refs/tags/v[1-9][0-9]*$"
