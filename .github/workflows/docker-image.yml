name: Verify and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vN tag to build and publish
        required: true
        type: string
      promote_runpod:
        description: Update configured RunPod templates after publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate template files
        run: |
          bash -n src/start_script.sh
          python3 -m py_compile tools/*.py
          find . -path ./.git -prune -o -name '*.json' -print0 | xargs -0 -r -n1 python3 -m json.tool >/dev/null
          python3 tools/validate_models.py --registry src/models_registry.json --workflows workflows --template template.json --offline
          PYTHONPATH=tools python3 -m unittest tools/test_update_runpod_template.py
      - name: Validate inherited base-image contract
        run: |
          grep -Eq '^ARG BASE_IMAGE=coohh88/comfyui-base:(latest|cuda[0-9.]+-torch[0-9.]+-comfyui[0-9.]+-python[0-9.]+-r[1-9][0-9]*)$' Dockerfile
          ! grep -q 'hearmeman/comfyui-base' Dockerfile
          ! grep -q 'apt-get install.*tmux' Dockerfile
          ! grep -q '/ComfyUI/custom_nodes/' Dockerfile
          grep -q '^RUNTIME_DIR=/opt/comfyui-runtime$' src/start_script.sh
          ! grep -q 'Hearmeman24/comfyui-runtime.git' src/start_script.sh

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || 'coohh88/comfyui-wan' }}
      TEMPLATE_REPOSITORY_URL: ${{ vars.TEMPLATE_REPOSITORY_URL || 'https://github.com/ilklatte/comfyui-wan.git' }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Validate release configuration
        id: release
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[1-9][0-9]*$ ]] || { echo 'Release tag must be vN, for example v1'; exit 2; }
          for name in DOCKER_IMAGE TEMPLATE_REPOSITORY_URL RELEASE_TAG DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            test -n "${!name}" || { echo "$name is required"; exit 2; }
          done
          base_image=$(python3 -c "import json; print(json.load(open('pins.json'))['base_image'])")
          test -n "$base_image" || { echo 'pins.json base_image is required'; exit 2; }
          [[ "$base_image" != replace-with-* ]] || { echo 'Replace the Wan base_image with your published, version-qualified comfyui-base image'; exit 2; }
          [[ "$base_image" =~ /comfyui-base:(latest|cuda[0-9.]+-torch[0-9.]+-comfyui[0-9.]+-python[0-9.]+-r[1-9][0-9]*)$ ]] || { echo 'Wan base_image must use comfyui-base:latest or an immutable rN tag'; exit 2; }
          echo "base_image=$base_image" >> "$GITHUB_OUTPUT"
          echo "image_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push immutable image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.release.outputs.image_tag }}
            ${{ env.DOCKER_IMAGE }}:latest
          build-args: |
            BASE_IMAGE=${{ steps.release.outputs.base_image }}
            TEMPLATE_REPOSITORY_URL=${{ env.TEMPLATE_REPOSITORY_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Promote image to RunPod templates
        if: ${{ inputs.promote_runpod && vars.RUNPOD_TEMPLATE_IDS != '' }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_IDS: ${{ vars.RUNPOD_TEMPLATE_IDS }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
        run: |
          test -n "$RUNPOD_API_KEY" || { echo 'RUNPOD_API_KEY is required when RUNPOD_TEMPLATE_IDS is configured'; exit 2; }
          python3 tools/update_runpod_template.py \
            --image "$DOCKER_IMAGE:${{ steps.release.outputs.image_tag }}" \
            --expected-repository "$DOCKER_IMAGE" \
            --template-ids "$RUNPOD_TEMPLATE_IDS"
